name: Browser validation on isolated Supabase
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "supabase/**"
      - "scripts/browser-smoke.mjs"
      - "scripts/package-pages.sh"
      - "package*.json"
      - "vite.config.ts"
      - ".github/workflows/browser-validation.yml"
concurrency:
  group: chevaliers-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      - name: Prepare disposable Supabase project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chevaliers-e2e"
          cd "$RUNNER_TEMP/chevaliers-e2e"
          supabase init
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          python - <<'PY'
          from pathlib import Path
          import re
          import os
          count = 0
          for p in Path("supabase/migrations").glob("*.sql"):
              data,n = re.subn(r"https?://[A-Za-z0-9-]+\.supabase\.co/functions/v1/", "http://127.0.0.1:1/functions/v1/", p.read_text())
              count += n
              p.write_text(data)
          assert count == 3
          p = Path("supabase/config.toml")
          s = p.read_text()
          s,n = re.subn(r"(?m)^major_version\s*=\s*\d+", "major_version = 17", s)
          assert n == 1
          run_id = int(os.environ["GITHUB_RUN_ID"])
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          base_port = 20000 + ((run_id + attempt) % 1500) * 20
          s, n = re.subn(r'(?m)^project_id\s*=\s*"[^"]+"', f'project_id = "chevaliers-e2e-{run_id}-{attempt}"', s)
          assert n == 1
          s = re.sub(r'\b5432([0-9])\b', lambda match: str(base_port + int(match.group(1))), s)
          p.write_text(s)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              print(f"E2E_EXPECTED_API_URL=http://127.0.0.1:{base_port+1}", file=env)
              print(f"E2E_WEB_ORIGIN=http://127.0.0.1:{base_port+15}", file=env)
              print(f"E2E_APP_PORT={base_port+15}", file=env)
          PY
      - name: Start completely local stack
        working-directory: ${{ runner.temp }}/chevaliers-e2e
        run: |
          supabase start
          supabase db reset --local --no-seed
          supabase status -o json > "$RUNNER_TEMP/local-supabase.json"
      - name: Install app and pinned browser test runner
        run: |
          npm ci
          npx prettier --check scripts/browser-smoke.mjs
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund --save-exact playwright@1.65.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/pages-tools" --no-audit --no-fund --save-exact wrangler@4.160.0
      - name: Compile isolated build and exercise browser workflows
        shell: bash
        run: |
          set -euo pipefail
          export VITE_SUPABASE_URL="$(jq -r '.API_URL' "$RUNNER_TEMP/local-supabase.json")"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$(jq -r '.ANON_KEY' "$RUNNER_TEMP/local-supabase.json")"
          export LOCAL_SERVICE_ROLE_KEY="$(jq -r '.SERVICE_ROLE_KEY' "$RUNNER_TEMP/local-supabase.json")"
          test "$VITE_SUPABASE_URL" = "$E2E_EXPECTED_API_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$LOCAL_SERVICE_ROLE_KEY"
          test "$LOCAL_SERVICE_ROLE_KEY" != null
          echo "::add-mask::$LOCAL_SERVICE_ROLE_KEY"
          export VITE_SUPABASE_PROJECT_ID=ci-local
          export VITE_TROOP_NAME="Chevaliers 58"
          export VITE_SITE_URL="$E2E_WEB_ORIGIN/velo"
          export VITE_BASE_PATH=/velo/
          export VITE_TROOP_STRAVA_CLUB_URL=https://www.strava.com/clubs/Chevaliers58
          export E2E_PLAYWRIGHT="$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs"
          # Only the disposable checkout permits the exact local API endpoint;
          # production requires HTTPS and is not modified in Git.
          python - <<'PY'
          from pathlib import Path
          p = Path('src/integrations/supabase/client.ts')
          s = p.read_text()
          before = r'if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL)) {'
          import os
          import re
          local_url = os.environ['E2E_EXPECTED_API_URL']
          assert re.fullmatch(r'http://127\.0\.0\.1:[0-9]{4,5}', local_url)
          after = before.replace('if (', f'if (SUPABASE_URL !== "{local_url}" && ', 1)
          assert s.count(before) == 1
          p.write_text(s.replace(before, after))
          PY
          # The privileged key is never available to Vite or the server build.
          env -u LOCAL_SERVICE_ROLE_KEY npm run build
          # Test a Pages-style static origin, not the Nitro Node server.
          bash scripts/package-pages.sh
          export WRANGLER_SEND_METRICS=false
          export CI=true
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL
          env -u LOCAL_SERVICE_ROLE_KEY "$RUNNER_TEMP/pages-tools/node_modules/.bin/wrangler" pages dev .output/pages --ip 127.0.0.1 --port "$E2E_APP_PORT" > "$RUNNER_TEMP/e2e-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent "$E2E_WEB_ORIGIN/velo/" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$E2E_WEB_ORIGIN/velo/" >/dev/null
          for path in auth timeline solidarite nouveau-mot-de-passe app; do
            curl --fail --silent "$E2E_WEB_ORIGIN/velo/$path" | grep -q 'Chevaliers 58'
          done
          curl --fail --silent "$E2E_WEB_ORIGIN/velo/manifest.webmanifest" | grep -q '/velo/app'
          for path in sw.js widget/troupe-km.js; do
            curl --fail --silent "$E2E_WEB_ORIGIN/velo/$path" > "$RUNNER_TEMP/asset.js"
            node --check "$RUNNER_TEMP/asset.js"
          done
          asset="$(find .output/pages/velo/assets -type f -name '*.js' -printf '%P\n' | head -1)"
          test -n "$asset"
          curl --fail --silent "$E2E_WEB_ORIGIN/velo/assets/$asset" > "$RUNNER_TEMP/asset.mjs"
          node --check "$RUNNER_TEMP/asset.mjs"
          echo "PASS Pages static routes and assets"
          node scripts/browser-smoke.mjs
      - name: Stop disposable stack
        if: always()
        working-directory: ${{ runner.temp }}/chevaliers-e2e
        run: supabase stop --no-backup
