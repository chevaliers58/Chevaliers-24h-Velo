name: Dependency upgrade trial
on:
  push:
    branches: [test/chevaliers58-dependency-upgrades]
permissions:
  contents: read
jobs:
  compare-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare original and candidate TypeScript diagnostics
        run: |
          git checkout dd0a466cff2a061e08ebe87550acbf57d427c02c -- package.json package-lock.json
          npm ci --no-audit
          npx tsc --noEmit --pretty false >/tmp/baseline-tsc.log 2>&1 || true
          git checkout HEAD -- package.json package-lock.json
          npm ci --no-audit
          npx tsc --noEmit --pretty false >/tmp/candidate-tsc.log 2>&1 || true
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          pattern = re.compile(r"^(.*?\(\d+,\d+\): error TS\d+:.*)$", re.M)
          a = Counter(pattern.findall(Path('/tmp/baseline-tsc.log').read_text()))
          b = Counter(pattern.findall(Path('/tmp/candidate-tsc.log').read_text()))
          print("Baseline error count:", sum(a.values()))
          print("Candidate error count:", sum(b.values()))
          print("New or changed diagnostics:", sum((b-a).values()))
          for line in sorted((b-a).elements()):
              print(line)
          print("Resolved or changed diagnostics:", sum((a-b).values()))
          PY
      - name: Verify dependency security
        run: npm audit
  regenerate-db-types:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      - name: Prepare isolated test database
        run: |
          mkdir -p "$RUNNER_TEMP/chevaliers-types"
          cd "$RUNNER_TEMP/chevaliers-types"
          supabase init
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          python - <<'PY'
          from pathlib import Path
          import re
          count = 0
          for p in Path("supabase/migrations").glob("*.sql"):
              data,n = re.subn(r"https?://[A-Za-z0-9-]+\.supabase\.co/functions/v1/", "http://127.0.0.1:1/functions/v1/", p.read_text())
              count += n
              p.write_text(data)
          assert count == 3
          p = Path('supabase/config.toml')
          p.write_text(re.sub(r"(?m)^major_version\s*=\s*\d+", "major_version = 17", p.read_text()))
          PY
      - name: Replay migrations and generate exact public schema types
        working-directory: ${{ runner.temp }}/chevaliers-types
        run: |
          supabase db start
          supabase db reset --local --no-seed
          supabase gen types typescript --local --schema public >/tmp/chevaliers-db-types.ts
          echo 'GENERATED_TYPES_START'
          cat /tmp/chevaliers-db-types.ts
          echo 'GENERATED_TYPES_END'
      - name: Stop isolated database
        if: always()
        working-directory: ${{ runner.temp }}/chevaliers-types
        run: supabase stop --no-backup
