name: Dependency upgrade trial
on:
  push:
    branches: [test/chevaliers58-dependency-upgrades]
permissions:
  contents: read
jobs:
  verify-generated-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_PROJECT_ID: ci-local
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_TROOP_NAME: Chevaliers 58
      VITE_SITE_URL: https://19-58.net/velo
      VITE_BASE_PATH: /velo/
      VITE_TROOP_STRAVA_CLUB_URL: https://www.strava.com/clubs/Chevaliers58
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Format generated database types and record exact candidate
        run: |
          npx prettier --write src/integrations/supabase/types.ts
          git hash-object src/integrations/supabase/types.ts
          echo 'FORMATTED_TYPES_START'
          cat src/integrations/supabase/types.ts
          echo 'FORMATTED_TYPES_END'
      - name: Diagnose remaining strict TypeScript errors
        run: |
          npx tsc --noEmit --pretty false >/tmp/tsc.log 2>&1 || true
          cat /tmp/tsc.log
          echo "Strict diagnostics: $(grep -c 'error TS[0-9]' /tmp/tsc.log || true)"
      - run: npm run lint
      - run: npm run build
      - run: npm audit
