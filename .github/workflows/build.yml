name: Build application

on:
  pull_request:
    branches: [main]
  push:
    branches: [chore/migrate-to-new-supabase]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: qxlsdauqoivqhoojlrwk
          VITE_SUPABASE_URL: https://qxlsdauqoivqhoojlrwk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_TROOP_NAME: Chevaliers 58
          VITE_SITE_URL: https://19-58.net/velo
          VITE_BASE_PATH: /velo/
          VITE_TROOP_STRAVA_CLUB_URL: https://www.strava.com/clubs/Chevaliers58
      - name: Verify deployment output
        run: |
          test -f .output/public/index.html
          test -f .output/server/index.mjs
          find .output -maxdepth 2 -type d -print
      - name: Upload build output for inspection
        uses: actions/upload-artifact@v4
        with:
          name: chevaliers58-build-output
          path: .output
          retention-days: 7
